# config/nav2_params.yaml
# Nav2 (ROS 2 Humble) parameters for the Loon-E ASV. A STARTING POINT: expect to
# tune almost everything on the water.
#
# Loaded by launch.py through nav2_bringup's navigation_launch.py, which starts
# the servers below. Not used: amcl / map_server. There is no prior map; the ZED
# wrapper publishes map -> odom (VIO + area memory) and odom -> zedx_camera_link.
#
# Frames: global "map", odom "odom", robot base "base_link" (from
# le1000_urdf_t4/urdf/loone_asv.urdf.xacro, a child of zedx_camera_link).
# Obstacles: the ZED's voxel point cloud, /zedx/zed_node/point_cloud/cloud_registered.
# Output: velocity_smoother publishes geometry_msgs/Twist on /cmd_vel, consumed by
# toon_e_hardware's hardware_node.
#
# Velocities here are in m/s and rad/s only once hardware_node's max_linear_speed /
# max_angular_speed are calibrated (config.yaml, toon_e_hardware wiki/CALIBRATION.md).
# Until then they are raw throttle fractions. Keep controller_server and
# velocity_smoother limits in sync with each other and below those maxima.
#
# If camera_name / zed_node_name change from zedx / zed_node, update every
# /zedx/zed_node/... topic below.

# ----------------------------------------------------------------------------------
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /zedx/zed_node/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # Leaving default_nav_to_pose_bt_xml unset uses nav2's stock
    # navigate_to_pose_w_replanning_and_recovery.xml (needs spin/backup/wait below).

# ----------------------------------------------------------------------------------
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0   # Hz; hardware_node stops the props after 0.5 s of silence
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      # TODO(team): boats do not hold a point precisely. Loosen these if it never
      # "arrives"; tighten them for docking tasks.
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 0.5
      stateful: true

    # Regulated Pure Pursuit: smooth path following for a non-holonomic surface
    # craft. It slows in tight curves and near the goal.
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # TODO(team): the single most important tuning block. Start slow.
      desired_linear_vel: 0.5          # m/s cruise speed
      lookahead_dist: 0.9
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.5
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.2
      # Differential thrust can pivot the boat, so rotate to the path heading first.
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.6
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 0.6
      # The ESCs are bidirectional, but a boat steers poorly in reverse; let the
      # BackUp recovery be the only thing that reverses.
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      transform_tolerance: 0.2

# ----------------------------------------------------------------------------------
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    # NavFn = Dijkstra/A* over the global costmap. Swap to nav2_smac_planner
    # (Hybrid-A*) for kinematically feasible curves.
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: true
      allow_unknown: true   # open water is mostly unknown space in a rolling costmap

# ----------------------------------------------------------------------------------
# Humble key names (Jazzy split these into local_/global_ variants).
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 0.6

# ----------------------------------------------------------------------------------
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# ----------------------------------------------------------------------------------
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    # [vx, vy, vtheta]; vy is 0 because the boat cannot move sideways.
    # TODO(team): keep these in sync with controller_server FollowPath limits.
    max_velocity: [0.5, 0.0, 0.6]
    min_velocity: [-0.3, 0.0, -0.6]
    max_accel: [0.5, 0.0, 0.6]
    max_decel: [-0.5, 0.0, -0.6]
    odom_topic: /zedx/zed_node/odom   # must match bt_navigator odom_topic above
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# ----------------------------------------------------------------------------------
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

# ----------------------------------------------------------------------------------
# Costmap obstacle source, shared by both costmaps.
#
# Heights are z in the costmap's global frame (odom / map). The ZED starts
# tracking with zedx_camera_link at z = 0, and the camera sits about 0.50 m above
# the waterline (URDF: 0.33 m above base_link, waterline at about -0.17 m), so the
# water surface is near z = -0.50. min_obstacle_height drops points less than
# ~15 cm above the water.
# TODO(team): measure the real camera height above the waterline and retune.
# VIO z drift over a long run moves the water plane; widen the margin if water
# starts showing up as obstacles late in a run.
#
# Do NOT enable the ZED's pos_tracking.two_d_mode: it zeroes roll and pitch, so on
# waves the cloud would be transformed at the wrong attitude and the water would
# mark as obstacles.

# ----------------------------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 1.0
      # No prior map, so the global costmap rolls with the boat. Goals farther than
      # half the window (25 m) from the boat cannot be planned; grow the window for
      # the GPS waypoint phase.
      rolling_window: true
      width: 50
      height: 50
      resolution: 0.1
      track_unknown_space: true
      # TODO(team): replace with the measured hull outline (metres, base_link frame).
      # From the URDF's 1.0 x 0.6 m hull plus ~2 cm padding.
      footprint: '[[0.55, 0.32], [0.55, -0.32], [-0.55, -0.32], [-0.55, 0.32]]'
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: zed_cloud
        zed_cloud:
          topic: /zedx/zed_node/point_cloud/cloud_registered
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -0.35
          max_obstacle_height: 1.5
          obstacle_max_range: 10.0   # ZED depth.max_depth is 15 m; far depth is noisy
          obstacle_min_range: 0.3
          raytrace_max_range: 12.0
          raytrace_min_range: 0.3
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 1.0
      always_send_full_costmap: true

# ----------------------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.1   # matches the ~100 mm ZED voxel cloud
      footprint: '[[0.55, 0.32], [0.55, -0.32], [-0.55, -0.32], [-0.55, 0.32]]'
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: zed_cloud
        zed_cloud:
          topic: /zedx/zed_node/point_cloud/cloud_registered
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -0.35
          max_obstacle_height: 1.5
          obstacle_max_range: 5.0
          obstacle_min_range: 0.3
          raytrace_max_range: 6.0
          raytrace_min_range: 0.3
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 1.0
      always_send_full_costmap: true
